services:
  postgres:
    image: postgres:17
    container_name: costa-rica-spanish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: costa_rica_spanish_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
